cv:
  name: Savan Doornink
  headline: Medewerker Beleid en Bedrijfsvoering
  photo: savan.png
  phone: "+31 6 39201735"
  email: savan24102@gmail.com
  location: Alkmaar, Nederland
  sections:
    Profiel:
      - >-
        Medewerker beleid en bedrijfsvoering met ruim vier jaar ervaring in klantcontact,
        procesoptimalisatie en software-implementatie. Werkt met KPI’s, planningen en externe partijen,
        en spreekt vloeiend Engels. Studeert Psychologie en zoekt een rol als Mid-Market
        Implementation Specialist in de EMEA-regio.
    Werkervaring:
      - company: Marcel Bakkum Rouwvervoer
        position: Medewerker Beleid en Bedrijfsvoering
        start_date: 2022-02
        end_date: present
        highlights:
          - Bijdragen aan software-implementatie en het verbeteren van bestaande werkwijzen
          - Signaleren van knelpunten en optimaliseren van administratieve en operationele werkprocessen
          - KPI’s opstellen en monitoren, resultaten evalueren en waar nodig bijsturen
          - >-
            Ontwikkelen en implementeren van beleidskaders gericht op klantgerichtheid en
            procesoptimalisatie binnen de organisatie
          - >-
            Verantwoordelijk voor het merendeel van het klantcontact en het begeleiden van klanten
            in verschillende processen rondom een uitvaart
          - Klantvragen beantwoorden, verwachtingen afstemmen en informatie helder en zorgvuldig overbrengen
          - >-
            Klantfeedback verwerken en opvolgen, met aandacht voor passende oplossingen en een
            zorgvuldige dienstverlening
          - Opstellen van jaarplanningen en personeelsroosters
          - Onderhouden van contacten met leveranciers en andere externe partijen
          - Uitvoeren en coördineren van administratieve en HR-werkzaamheden
      - company: Studio Forta
        position: Hostess
        start_date: 2026-10
        end_date: present
        highlights:
          - Ontvangen en aanmelden van klanten in de studio
          - Klantcontact afhandelen, zowel fysiek als administratief
          - Werkzaamheden als barista
      - company: Kingsinn
        position: Receptioniste
        start_date: 2022-05
        end_date: 2022-10
        highlights:
          - Vriendelijk en professioneel ontvangen van bezoekers en klanten, met een gastvrije eerste indruk
          - Nauwkeurig verwerken en archiveren van binnenkomende post en digitale correspondentie
          - Beheren van de telefooncentrale en doorverbinden van gesprekken met correcte informatieverstrekking
          - Oplossen van klantvragen en klachten aan de balie met empathie en klantgerichte communicatie
          - >-
            Opvangen en begeleiden van bezoekers met aandacht voor persoonlijke wensen en een
            comfortabele wachtruimte
      - company: De Groene Slager
        position: Allround medewerker
        start_date: 2019-09
        end_date: 2021-02
        highlights:
          - Verlenen van service en ondersteuning aan klanten
          - Toepassen van productkennis in het klantcontact
          - Servicegericht en efficiënt werken en meerdere taken gelijktijdig uitvoeren
          - Bewerken en bereiden van verschillende soorten vlees
      - company: Zoomers
        position: Allround medewerker
        start_date: 2018-04
        end_date: 2022-10
        highlights:
          - Klantgericht, efficiënt en proactief handelen in drukke en stressvolle situaties
          - Inwerken van nieuw personeel
          - Werkzaam in de bar, keuken, afwas en bediening (seizoenswerk)
    Opleiding:
      - institution: Open Universiteit
        area: Psychologie
        location: Amsterdam
        start_date: 2025-09
        end_date: present
      - institution: HvA
        area: Pedagogiek
        location: Amsterdam
        start_date: 2020-09
        end_date: 2022-02
      - institution: Bonhoeffer College
        area: Havo
        start_date: 2014-09
        end_date: 2019-04
    Stages:
      - company: Permens
        position: Streetcornerwork
        location: Haarlem
        start_date: 2021-01
        end_date: 2021-06
      - company: Bataviaschool
        position: Lerares Nederlands, nieuwkomersonderwijs
        location: Amsterdam
        start_date: 2021-10
        end_date: 2022-05
    Cursussen:
      - bullet: >-
          Beschermjassen (feb 2022): interculturele competenties versterken, systemisch waarnemen
          en cliënten inbedden in hun historie, cultuur en gemeenschap tijdens ingrijpende levensgebeurtenissen
      - bullet: Videografie en editing (mrt 2025)
    Vaardigheden:
      - bullet: Office Suite
      - bullet: Management
      - bullet: Rijbewijs B
    Talen:
      - label: Nederlands
        details: moedertaal
      - label: Engels
        details: vloeiend
    Hobby’s:
      - bullet: Duiken
      - bullet: Wijn (WSET 2 en 3)
      - bullet: Lezen
      - bullet: Hiken
design:
  theme: moderncv
  page:
    size: a4
    top_margin: 0.7in
    bottom_margin: 0.7in
    left_margin: 0.7in
    right_margin: 0.7in
    show_footer: true
    show_top_note: false
  colors:
    body: "#30343B"
    name: "#183B56"
    headline: "#526475"
    connections: "#526475"
    section_titles: "#183B56"
    links: "#183B56"
    footer: "#737D87"
  typography:
    font_family: Source Sans 3
    alignment: left
    line_spacing: 0.55em
    font_size:
      body: 10.5pt
      name: 29pt
      headline: 12pt
      connections: 9.5pt
      section_titles: 13pt
    bold:
      name: true
      section_titles: true
  header:
    alignment: left
    photo_width: 2.8cm
    photo_position: right
    photo_space_left: 0.6cm
    photo_space_right: 0cm
    space_below_name: 0.2cm
    space_below_headline: 0.3cm
    space_below_connections: 0.5cm
    connections:
      phone_number_format: international
      space_between_connections: 0.4cm
  links:
    underline: false
  section_titles:
    type: moderncv
    line_thickness: 0.5pt
    space_above: 0.5cm
    space_below: 0.25cm
  sections:
    space_between_regular_entries: 1.2em
  entries:
    date_and_location_width: 3.7cm
    space_between_columns: 0.4cm
    allow_page_break: false
    highlights:
      space_above: 0.15cm
      space_between_items: 0.08cm
  templates:
    education_entry:
      main_column: |-
        **INSTITUTION**, AREA -- LOCATION
        SUMMARY
        HIGHLIGHTS
